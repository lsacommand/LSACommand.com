name: Decode page OG images
on:
  push:
    paths:
      - "images/og/*.b64"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode-og-pages
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack page OG image bundles and drop the b64 sources
        run: |
          shopt -s nullglob
          files=(images/og/*.tgz.b64)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to decode"; exit 0; fi
          for f in "${files[@]}"; do
            base64 -d "$f" | tar xz -C images/og
            rm "$f"
          done
          git config user.name "LSA Command bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A images/og
          git commit -m "Add page-specific OG share images (1200x630) in images/og/"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
