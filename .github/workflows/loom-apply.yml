name: loom-apply
on:
  push:
    branches: [loom-fixes-2026-11-19]
    paths: ['.github/workflows/loom-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loom-fixes-2026-11-19
          path: b
      - uses: actions/checkout@v4
        with:
          ref: main
          path: m
          fetch-depth: 0
      - name: Apply Loom fixes bundle onto main
        run: |
          set -e
          cat b/_loom_bundle/part0 b/_loom_bundle/part1 | base64 -d > /tmp/loom.tgz
          echo "3b569b50787addaf8e352a8b7e188007860190405ef19284c2df36fe7354c703  /tmp/loom.tgz" | sha256sum -c -
          cd m
          # refuse if anyone changed the same files on main since the base commit
          CHANGED=$(git diff --name-only 2905060 HEAD -- $(cat ../b/_loom_bundle/files.txt) $(cat ../b/_loom_bundle/delete.txt) || true)
          if [ -n "$CHANGED" ]; then echo "Conflict with newer main changes:"; echo "$CHANGED"; exit 1; fi
          tar xzf /tmp/loom.tgz -C .
          while IFS= read -r f; do [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"; done < ../b/_loom_bundle/delete.txt
          git config user.name "LSA Command"
          git config user.email "noreply@lsacommand.com"
          git add -A -- . ':!.github'
          git commit -m "Loom fixes: booked-call screenshot with red-box callouts, Booked calls tab, high-value and address callouts, callback-number copy, click-to-expand lightbox, keyword image names and alts"
          git push origin HEAD:main
