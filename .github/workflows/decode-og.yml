name: Decode OG image
on:
  push:
    paths:
      - "images/og-lsa-command.png.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode og-lsa-command.png and drop the b64 source
        run: |
          if [ -f images/og-lsa-command.png.b64 ]; then
            base64 -d images/og-lsa-command.png.b64 > images/og-lsa-command.png
            rm images/og-lsa-command.png.b64
            git config user.name "LSA Command bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A images
            git commit -m "Add images/og-lsa-command.png (1200x630 social share image)"
            git push origin HEAD:main
          fi
