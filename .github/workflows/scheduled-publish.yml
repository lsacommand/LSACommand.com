name: Scheduled publish
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scheduled-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish anything that is due
        run: python3 scripts/scheduled_publish.py
      - name: Commit and push to main (Vercel deploys on push)
        run: |
          git config user.name "LSA Command scheduled publish"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Scheduled publish $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi
