name: merge-to-main
on:
  push:
    branches: [golive-merge-2026-11-19]
    paths: ['.github/workflows/merge-to-main.yml']
permissions:
  contents: write
jobs:
  ff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: golive-merge-2026-11-19
          fetch-depth: 0
      - name: Fast-forward main to the go-live merge
        run: |
          set -e
          T=e0475364a2b94174b272e261a058a4cfb8a03667
          git merge-base --is-ancestor origin/main $T
          git push origin $T:refs/heads/main
