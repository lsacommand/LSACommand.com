name: merge-extract
on:
  push:
    branches: [golive-merge-2026-11-19]
    paths: ['.github/workflows/merge-extract.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: golive-merge-2026-11-19
      - name: Unpack go-live merge bundle
        run: |
          set -e
          test -f _merge_bundle/part0 || { echo "no bundle"; exit 0; }
          cat _merge_bundle/part0 _merge_bundle/part1 _merge_bundle/part2 _merge_bundle/part3 | base64 -d > /tmp/merge.tgz
          echo "7dbed04857c44d39f98c596b6345678132e4bfadc0c19f092ab2b816921cdc0a  /tmp/merge.tgz" | sha256sum -c -
          tar xzf /tmp/merge.tgz -C .
          while IFS= read -r f; do [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"; done < _merge_bundle/delete.txt
          git rm -rq _merge_bundle
          git config user.name "LSA Command"
          git config user.email "noreply@lsacommand.com"
          git add -A -- . ':!.github'
          git status --short | wc -l
          git commit -m "Go-live: golive-final-2026-11-18 merged with main (new hero video, proof screenshots, team branding, /book/ calendar)"
          git push origin HEAD:golive-merge-2026-11-19
